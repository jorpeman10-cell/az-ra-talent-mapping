<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问卷审核 - Hiijob</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6f8;margin:0;color:#1f2329}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:#86909c;font-size:13px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e5e6eb;border-radius:8px;padding:20px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.qa{margin-bottom:14px}
.q{font-weight:600;font-size:13px;color:#4e5969;margin-bottom:4px}
.a{font-size:14px;line-height:1.7;white-space:pre-wrap}
.state{text-align:center;color:#4e5969;padding:64px 0;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e6eb;padding:12px 16px;display:flex;gap:12px;justify-content:center}
button{cursor:pointer;border-radius:6px;border:1px solid #e5e6eb;background:#fff;padding:9px 20px;font-size:14px}
.primary{background:#d2691e;border-color:#d2691e;color:#fff}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:4px;padding:2px 8px;font-size:12px;margin-left:8px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state">加载中…</div></div>
<div class="bar" id="bar" style="display:none">
  <button id="confirmBtn" class="primary" onclick="confirmReview()">审核确认 · 去 Agent 出定岗定级报告</button>
</div>
<div id="toast"></div>
<script>
const token = location.pathname.split("/r/")[1];
let review = null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderArchive(title, arch){
  if(!arch) return "";
  const answers = arch.answers || {};
  const items = Object.entries(answers).map(([k,v]) =>
    `<div class="qa"><div class="q">${esc(k)}</div><div class="a">${esc(Array.isArray(v)?v.join("、"):v)}</div></div>`).join("");
  return `<div class="card"><h2>${esc(title)}</h2>${items || '<div class="a">（无原文）</div>'}</div>`;
}
async function load(){
  const r = await fetch(`/api/r/${token}/review`);
  if(!r.ok){
    const why = {"expired":"审核链接已过期","not_found":"链接无效"}[(await r.json().catch(()=>({}))).detail] || "链接无效";
    document.getElementById("app").innerHTML = `<div class="state">${why}</div>`;
    return;
  }
  review = await r.json();
  const badge = review.hr_reviewed_at ? '<span class="badge">已确认</span>' : '';
  document.getElementById("app").innerHTML =
    `<h1>${esc(review.name)} · 双问卷审核${badge}</h1>
     <div class="sub">审核确认后前往智能问答获取定岗定级报告</div>` +
    renderArchive("候选人自评", review.self) +
    renderArchive("HR 面评", review.hr);
  if(!review.hr_reviewed_at) document.getElementById("bar").style.display = "flex";
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>{t.style.display="none"}, 2400);
}
async function confirmReview(){
  const r = await fetch(`/api/r/${token}/confirm`, {method:"POST"});
  if(!r.ok){ toast("确认失败，请稍后重试"); return; }
  const out = await r.json();
  try { await navigator.clipboard.writeText(out.query); toast("已复制查询词，正在打开智能问答…"); }
  catch(e){ toast("请手动输入：" + out.query); }
  setTimeout(()=>{ window.open(out.agent_url, "_blank", "noopener,noreferrer"); }, 800);
  document.getElementById("bar").style.display = "none";
}
load();
</script>
</body>
</html>
